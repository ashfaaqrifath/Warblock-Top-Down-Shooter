<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warblock - Top Down Shooter</title>
    <link rel="stylesheet" href="styles.css">



</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="hud">
            <div>Wave: <span id="waveDisplay">1</span></div>
            <div>Currency: $<span id="currencyDisplay">0</span></div>
            <div>Ammo: <span id="ammoDisplay">12/30</span></div>
            <div>Health: <span id="healthDisplay">100</span></div>
            <div id="upgradeIcons"></div>
        </div>

        <div id="shop">
            <h2>Inventory</h2>
            <p>Currency: $<span id="shopCurrency">0</span></p>
            <div class="shop-grid">
                <button class="upgrade-btn" data-upgrade="extendedMag">
                    <strong>Extended Mag</strong><br>
                    +5 Magazine Size<br>
                    Cost: $<span class="cost">50</span>
                </button>
                <button class="upgrade-btn" data-upgrade="highCaliber">
                    <strong>High-Caliber Rounds</strong><br>
                    +25% Damage<br>
                    Cost: $<span class="cost">75</span>
                </button>
                <button class="upgrade-btn" data-upgrade="cryoRounds">
                    <strong>Cryo Rounds</strong><br>
                    Slow enemies on hit<br>
                    Cost: $<span class="cost">100</span>
                </button>
                <button class="upgrade-btn" data-upgrade="quantumDisplacer">
                    <strong>Quantum Displacer</strong><br>
                    20% chance to teleport enemies<br>
                    Cost: $<span class="cost">150</span>
                </button>
                <button class="upgrade-btn" data-upgrade="vampiricStrike">
                    <strong>Vampiric Strike</strong><br>
                    Heal 5 HP per kill<br>
                    Cost: $<span class="cost">125</span>
                </button>
                <button class="upgrade-btn" data-upgrade="rapidFire">
                    <strong>Rapid Fire</strong><br>
                    -20% Fire Rate Delay<br>
                    Cost: $<span class="cost">80</span>
                </button>
            </div>
            <button id="nextWaveBtn">Start Next Wave</button>
        </div>

        <div class="reload-bar" id="reloadBar" style="display: none;">
            <div class="reload-fill" id="reloadFill"></div>
        </div>
    </div>

    <script src="warblock.js"></script>
</body>
</html>

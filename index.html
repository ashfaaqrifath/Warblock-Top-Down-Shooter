<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Warblock - Top Down Shooter</title>
<link rel="stylesheet" href="css/login.css">
<link rel="shortcut icon" href="mylogo3.png">
</head>
<body>

<div class="container">

  <!-- Login -->
  <form class="card active" id="login">
    <h2>Login</h2>

    <div class="field">
      <input type="email" id="login-email" required placeholder=" ">
      <label>Email</label>
    </div>

    <div class="field">
      <input type="password" id="login-password" required placeholder=" ">
      <label>Password</label>
    </div>

    <button type="button" onclick="login()">Login</button>

    <div class="links">
      <span onclick="show('register')">Create account</span>
    </div>
  </form>

  <!-- Register -->
  <form class="card" id="register">
    <h2>Create Account</h2>

    <div class="field">
      <input type="text" id="register-username" required placeholder=" ">
      <label>Username</label>
    </div>

    <div class="field">
      <input type="email" id="register-email" required placeholder=" ">
      <label>Email</label>
    </div>

    <div class="field">
      <input type="password" id="register-password" required placeholder=" ">
      <label>Password</label>
    </div>

    <button type="button" onclick="register()">Sign Up</button>

    <div class="links">
      <span onclick="show('login')">Already have an account?</span>
    </div>
  </form>

</div>

<script type="module">

  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  // --- Supabase Setup ---
  const SUPABASE_URL = "https://rnkjnwgkbntinkhgrbpm.supabase.co"
  const SUPABASE_KEY = "sb_publishable_mSMt53nucVEn5liO4sZuSQ_Xm_sX4Nz"
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

  // --- Switch Forms ---
  window.show = function(id){
    document.querySelectorAll('.card').forEach(card=>{
      card.classList.remove('active')
    })
    document.getElementById(id).classList.add('active')
  }

  // --- Register ---
  window.register = async function(){
    const email = document.getElementById("register-email").value
    const password = document.getElementById("register-password").value
    const username = document.getElementById("register-username").value

    // Try signup (ignore "already registered" error)
    const { error: signUpError } = await supabase.auth.signUp({
      email,
      password,
      options: { emailRedirectTo: window.location.href }
    })

    if(signUpError && !signUpError.message.includes("already registered")){
      alert("Error: " + signUpError.message)
      return
    }

    // Check if user exists in leaderboard
    const { data: existing } = await supabase
      .from('leaderboard')
      .select('id')
      .eq('email', email)
      .single()

    if(existing){
      // Update username if needed
      const { error: updateError } = await supabase
        .from('leaderboard')
        .update({ username })
        .eq('email', email)

      if(updateError){
        alert("Error updating leaderboard: " + updateError.message)
        return
      }
    }else{
      // Insert new row
      const { error: insertError } = await supabase
        .from('leaderboard')
        .insert([{ email, username }])

      if(insertError){
        alert("Error saving to leaderboard: " + insertError.message)
        return
      }
    }

    alert("Registered. You can login now.")
    show('login')
  }

  // --- Login ---
  window.login = async function(){
    const email = document.getElementById("login-email").value
    const password = document.getElementById("login-password").value

    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    })

    if(error){
      alert("Login failed: " + error.message)
      return
    }

    // Get username from leaderboard
    const { data: userData, error: dbError } = await supabase
      .from('leaderboard')
      .select('username')
      .eq('email', email)
      .single()

    const username = dbError ? "" : userData.username
    window.location.href = "game.html";
  }

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warblock - Top Down Shooter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="mylogo3.png">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="hud">
            <div style="color: #fff;">Wave: <span id="waveDisplay">1</span></div>
            <div style="color: #ffc800;">Credits: <span id="creditsDisplay">0</span></div>
            <div style="color: #0099ff;">Ammo: <span id="ammoDisplay">12/30</span></div>
            <div style="color: #00ff84d8;">Health: <span id="healthDisplay">100</span></div>
            <div id="upgradeIcons"></div>
        </div>

        <div id="shop">
            <h2>Inventory</h2>
            <p style="color: #ffc800;">Credits: <span id="shopCredits">0</span></p>
            <div class="shop-grid">
                <button class="upgrade-btn" data-upgrade="extendedMag">
                    <strong>Extended Mag</strong><br>
                    +5 Magazine Size<br>
                    Credits: <span class="cost">50</span>
                </button>
                <button class="upgrade-btn" data-upgrade="highCaliber">
                    <strong>High-Caliber Rounds</strong><br>
                    +25% Damage<br>
                    Credits: <span class="cost">75</span>
                </button>
                <button class="upgrade-btn" data-upgrade="temporalRounds">
                    <strong>Temporal Rounds</strong><br>
                    Slow enemies on hit<br>
                    Credits: <span class="cost">100</span>
                </button>
                <button class="upgrade-btn" data-upgrade="quantumDisplacer">
                    <strong>Quantum Displacer</strong><br>
                    20% chance to teleport enemies<br>
                    Credits: <span class="cost">150</span>
                </button>
                <button class="upgrade-btn" data-upgrade="vampiricStrike">
                    <strong>Vampiric Strike</strong><br>
                    Heal 5 HP per kill<br>
                    Credits: <span class="cost">125</span>
                </button>
                <button class="upgrade-btn" data-upgrade="rapidFire">
                    <strong>Rapid Fire</strong><br>
                    -20% Fire Rate Delay<br>
                    Credits: <span class="cost">80</span>
                </button>
            </div>
            <div class="shop-actions">
                    <button id="solvePuzzleBtn">Solve Puzzle</button>
                <button id="buySelectedBtn">Upgrade</button>
                <button id="nextWaveBtn">Start Next Wave</button>
            </div>
        </div>

            <!-- Puzzle modal overlay -->
            <div id="puzzleModal" class="modal" style="display:none;">
                <div class="modal-content">
                    <button id="closePuzzleBtn" class="modal-close">✕</button>
                    <h3>Heart Game Puzzle</h3>
                    <img id="puzzleImageModal" src="" alt="Puzzle image">
                    <div class="modal-inputs">
                        <input type="number" id="answerInputModal" placeholder="Your answer">
                        <button id="submitBtnModal">Submit</button>
                    </div>
                    <div id="puzzleResult" class="modal-result"></div>
                </div>
            </div>

        <div class="reload-bar" id="reloadBar" style="display: none;">
            <div class="reload-fill" id="reloadFill"></div>
        </div>
    </div>

    <script src="warblock.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Warblock - Top Down Shooter</title>
<link rel="stylesheet" href="css/login.css">
<link rel="icon" type="image/png" href="gamelogo.png?v=1">
</head>
<body>

<div class="container">
  <div class="form-wrapper">
    <div class="image-section">
      <img src="banner.png" class="game-banner">
    </div>
    <div class="forms-section">
      <!-- Login -->
      <form class="card active" id="login">
    <h2>Login</h2>

    <div class="field">
      <input type="email" id="login-email" required placeholder=" ">
      <label>Email</label>
    </div>

    <div class="field">
      <input type="password" id="login-password" required placeholder=" ">
      <label>Password</label>
    </div>

    <button type="button" onclick="login()">Login</button>

    <div class="links">
      <span onclick="show('register')">Create account</span>
    </div>
  </form>

  <!-- Register -->
  <form class="card" id="register">
    <h2>Create Account</h2>

    <div class="field">
      <input type="text" id="register-username" required placeholder=" ">
      <label>Username</label>
    </div>

    <div class="field">
      <input type="email" id="register-email" required placeholder=" ">
      <label>Email</label>
    </div>

    <div class="field">
      <input type="password" id="register-password" required placeholder=" ">
      <label>Password</label>
    </div>

    <button type="button" onclick="register()">Sign Up</button>

    <div class="links">
      <span onclick="show('login')">Already have an account?</span>
    </div>
  </form>
    </div>
  </div>
</div>

<script type="module" src="/js/Auth.js"></script>

</body>
</html>
